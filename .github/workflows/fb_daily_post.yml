name: Bhakti Lens Daily Facebook Auto Post

on:
  schedule:
    # Runs everyday at 06:30 AM IST (01:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests google-genai pillow google-generativeai

      - name: Run Facebook Auto Poster with Gemini Vision
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN || secrets.FB_PAGE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python fb_auto_poster.py

      - name: Commit & Push Updated Queues
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Bhakti Lens Bot"
          git add images_urls.txt used_urls.txt images_urls_backup.txt || true
          git commit -m "Auto-posted daily image to Facebook Page [skip ci]" || true
          git push origin master || true

